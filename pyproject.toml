[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "nix-desktop"
version = "0.11.1"
authors = [{name = "@hexm1sery"}]
license = "MIT"
description = "Public username search for Windows, macOS and Linux"
requires-python = ">=3.11"
dependencies = ["pywebview==6.2.1", "aiohttp==3.14.5", "aiohttp-socks==0.12.0"]

[project.scripts]
nix = "nickatlas.app:main"

[tool.setuptools.packages.find]
include = ["nickatlas*"]

[tool.setuptools.package-data]
nickatlas = ["assets/*.ttf", "assets/*.svg", "assets/*.ico", "assets/*.png", "assets/catalogs/*.json", "web/*"]

[tool.setuptools]
license-files = ["LICENSE.txt", "licenses/**/*.txt", "licenses/**/*LICENSE*"]
